name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      skip-playwright: true
      skip-codecov: true

  release:
    uses: cyberuni/.github/.github/workflows/pnpm-release-changeset.yml@v2
    needs: code
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    secrets: inherit
